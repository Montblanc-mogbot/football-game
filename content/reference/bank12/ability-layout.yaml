recordLayouts:
  quarterback:
    widthBytes: 5
    fields:
      - packedNibblePair: [RushingPower, RunningSpeed]
      - packedNibblePair: [MaximumSpeed, HittingPower]
      - byte: FaceIdentifier
      - packedNibblePair: [PassingSpeed, PassControl]
      - packedNibblePair: [AccuracyOfPassing, AvoidPassBlock]
  skillPosition:
    widthBytes: 4
    fields:
      - packedNibblePair: [RushingPower, RunningSpeed]
      - packedNibblePair: [MaximumSpeed, HittingPower]
      - byte: FaceIdentifier
      - packedNibblePair: [BallControl, Receptions]
  offensiveLine:
    widthBytes: 3
    fields:
      - packedNibblePair: [RushingPower, RunningSpeed]
      - packedNibblePair: [MaximumSpeed, HittingPower]
      - byte: FaceIdentifier
  defender:
    widthBytes: 4
    fields:
      - packedNibblePair: [RushingPower, RunningSpeed]
      - packedNibblePair: [MaximumSpeed, HittingPower]
      - byte: FaceIdentifier
      - packedNibblePair: [PassInterceptions, Quickness]
  kickerOrPunter:
    widthBytes: 4
    fields:
      - packedNibblePair: [RushingPower, RunningSpeed]
      - packedNibblePair: [MaximumSpeed, HittingPower]
      - byte: FaceIdentifier
      - packedNibblePair: [KickOrPuntAbility, AvoidKickBlock]
